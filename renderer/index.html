<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0" />
  <title>AETHER Deterministic Viewport (1080x1920)</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      /* Disable CSS transitions/animations per deterministic contract */
      transition: none !important;
      animation: none !important;
    }
    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #0d131a;
      font-family: Georgia, 'Times New Roman', serif;
      -webkit-font-smoothing: antialiased;
    }
    #aether-viewport {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }
    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      display: block;
    }
    /* Safe-zone overlay for Francis's captions & labels:
       90px left, 180px right, 180px top, 300px bottom */
    #overlay-layer {
      position: absolute;
      top: 180px;
      left: 90px;
      width: calc(1080px - 90px - 180px);
      height: calc(1920px - 180px - 300px);
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .header-badges {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .badge-hypothetical {
      background: rgba(217, 119, 6, 0.92);
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 8px 18px;
      border-radius: 8px;
    }
    .badge-timescale {
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.25);
      color: #e2e8f0;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 28px;
      padding: 8px 18px;
      border-radius: 8px;
    }
    .metric-readout {
      align-self: flex-start;
      background: rgba(15, 23, 42, 0.82);
      border-left: 6px solid #8c1515;
      padding: 16px 24px;
      border-radius: 4px 12px 12px 4px;
      color: #f8fafc;
    }
    .metric-value {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 88px;
      font-weight: 700;
      line-height: 1.05;
    }
    .metric-label {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 36px;
      color: #cbd5e1;
      margin-top: 6px;
    }
    .caption-box {
      background: rgba(10, 15, 24, 0.86);
      padding: 24px 32px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }
    .caption-primary {
      color: #ffffff;
      font-size: 54px;
      line-height: 1.24;
      font-weight: 600;
    }
    .caption-source {
      margin-top: 12px;
      color: #94a3b8;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 32px;
    }
  </style>
</head>
<body>
  <div id="aether-viewport">
    <canvas id="webgl-canvas" width="1080" height="1920"></canvas>
    <div id="overlay-layer">
      <div class="header-badges" id="overlay-badges"></div>
      <div class="metric-readout" id="overlay-metric" style="display:none;"></div>
      <div class="caption-box" id="overlay-caption" style="display:none;"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
