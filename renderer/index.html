<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0" />
  <title>AETHER Deterministic Viewport (1080x1920)</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      /* Disable CSS transitions/animations per deterministic contract */
      transition: none !important;
      animation: none !important;
    }
    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #0d131a;
      font-family: Georgia, 'Times New Roman', serif;
      -webkit-font-smoothing: antialiased;
    }
    #aether-viewport {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }
    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      display: block;
    }
    /* Caption + overlay layer (Workstream C). Full-frame; its styles are
       injected by src/overlays/overlayCss.ts from the caption style tokens. */
    #overlay-layer {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="aether-viewport">
    <canvas id="webgl-canvas" width="1080" height="1920"></canvas>
    <div id="overlay-layer"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
