<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AETHER review{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='review.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">AETHER <span>review</span></a>
    <span class="api">API {{ api_url }}</span>
  </header>
  <main>
    {% if notice %}<p class="flash ok" role="status">{{ notice }}</p>{% endif %}
    {% if error %}<p class="flash bad" role="alert">{{ error }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
